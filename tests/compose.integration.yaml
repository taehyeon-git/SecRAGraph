services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secragraph_test
      POSTGRES_USER: secragraph
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432"
    volumes:
      - ../infra/postgres/init/001_roles.sql:/docker-entrypoint-initdb.d/001_roles.sql:ro
      - ./postgres/002_test_reader_login.sql:/docker-entrypoint-initdb.d/002_test_reader_login.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secragraph -d secragraph_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:${QDRANT_TEST_PORT:-56333}:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      timeout: 3s
      retries: 20
