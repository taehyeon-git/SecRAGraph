[project]
name = "secragraph"
version = "0.1.0"
description = "RAG- and LangGraph-powered security review platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain-openai>=1.6.7",
  "langgraph>=1.2.14",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "python-multipart>=0.0.9,<1",
  "qdrant-client>=1.19.1",
  "rich>=13,<15",
  "sqlalchemy>=2,<3",
  "sqlglot==30.21.0",
  "streamlit>=1.65.0",
  "structlog>=24,<27",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
security-review = "security_review.cli:app"

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "mypy>=1.11,<3",
  "pip-audit>=2.10.1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "integration: tests that require external infrastructure",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"examples/insecure/*" = ["S"]
"tests/*" = ["S101", "S105"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["security_review"]
