services:
  target:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
    command:
      - /app/.venv/bin/uvicorn
      - apps.dast_fixture.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      SECRAGRAPH_DAST_TEST_TOKEN: ${SECRAGRAPH_DAST_TEST_TOKEN:?disposable fixture token required}
    labels:
      io.secragraph.dast.disposable: "true"
      io.secragraph.dast.active-permitted: "true"
    networks: [fixture]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

networks:
  fixture:
    internal: true
