name: Security self-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.12"
      - run: uv python install 3.11
      - run: uv sync --frozen
      - run: uv run security-review scan src --format sarif --output build/secragraph.sarif
      - run: uv run python scripts/validate_sarif.py build/secragraph.sarif
      - name: Upload SARIF
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]')
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: build/secragraph.sarif
          category: secragraph-self-scan
