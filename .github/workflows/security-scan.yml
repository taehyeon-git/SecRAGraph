name: CodeQL security self-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A JS/TS CodeQL database fails when this Python-first repository has no JS/TS files.
      - name: Detect JavaScript and TypeScript source
        id: javascript_source
        if: matrix.language == 'javascript-typescript'
        shell: bash
        run: |
          if git ls-files -z -- '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.mts' '*.cts' | grep -qz .; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No tracked JavaScript or TypeScript source; skipping this language.'
          fi

      - name: Initialize CodeQL
        if: matrix.language == 'python' || steps.javascript_source.outputs.present == 'true'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      - name: Analyze source
        if: matrix.language == 'python' || steps.javascript_source.outputs.present == 'true'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
