name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.12"
      - run: uv python install 3.11
      - run: uv sync --frozen --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src apps scripts/local_up.py scripts/prepare_case_corpus.py scripts/run_dast_evidence.py scripts/run_history_evidence.py scripts/ci_container_image.py scripts/check_compose_evidence.py scripts/compose_smoke.py scripts/aggregate_pipeline_benchmark.py scripts/run_pipeline_contract_benchmark.py infra/scanners/install_trivy.py
      - run: uv run bandit -q -r src apps
      - name: Run keyless RAG evidence
        run: uv run python -m scripts.run_rag_evidence
      - name: Validate RAG evidence files
        run: |
          test -s build/evidence/rag.json
          test -s build/evidence/rag.md
          uv run python -m json.tool build/evidence/rag.json > /dev/null
      - name: Run controlled graph-provider contract benchmark
        run: uv run python -m scripts.run_pipeline_contract_benchmark
      - name: Validate graph-provider contract evidence
        run: |
          test -s build/evidence/pipeline-contract.json
          test -s build/evidence/pipeline-contract.md
          uv run python -m json.tool build/evidence/pipeline-contract.json > /dev/null

      - name: Build pinned scanner runtime
        run: docker build --target runtime --tag secragraph:benchmark .
      - name: Measure authored multi-engine scanner cases
        run: |
          mkdir -p build/evidence
          docker run --rm --network none --read-only \
            --security-opt no-new-privileges --cap-drop ALL \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp/secragraph:rw,exec,nosuid,nodev,size=256m,mode=1777 \
            --tmpfs /tmp/secragraph-snapshots:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --mount type=bind,src="$PWD/scripts",dst=/app/scripts,readonly \
            --mount type=bind,src="$PWD/build/evidence",dst=/app/build/evidence \
            secragraph:benchmark /app/.venv/bin/python \
            -m scripts.run_multiengine_benchmark \
            --cases data/evaluation/multiengine_cases.json \
            --staging-dir /tmp/secragraph \
            --output-dir /app/build/evidence \
            --require-complete --require-traces --require-match
      - name: Require multi-engine JSON evidence
        run: test -s build/evidence/multiengine-scanner.json
      - name: Require multi-engine Markdown evidence
        run: test -s build/evidence/multiengine-scanner.md
      - name: Parse multi-engine JSON evidence
        run: uv run python -m json.tool build/evidence/multiengine-scanner.json > /dev/null
      - name: Require complete Compose policy regression evidence
        run: uv run python -m scripts.check_compose_evidence --cases data/evaluation/multiengine_cases.json --evidence build/evidence/multiengine-scanner.json
      - name: Publish RAG and scanner evidence
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secragraph-evidence
          path: |
            build/evidence/rag.json
            build/evidence/rag.md
            build/evidence/pipeline-contract.json
            build/evidence/pipeline-contract.md
            build/evidence/multiengine-scanner.json
            build/evidence/multiengine-scanner.md
          if-no-files-found: error
          retention-days: 14

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: secragraph_test
          POSTGRES_USER: secragraph
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U secragraph -d secragraph_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 56333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      SECRAGRAPH_DATABASE_URL: postgresql+psycopg://secragraph@127.0.0.1:55432/secragraph_test
      SECRAGRAPH_TEST_DATABASE_URL: postgresql+psycopg://secragraph@127.0.0.1:55432/secragraph_test
      SECRAGRAPH_TEST_QDRANT_URL: http://127.0.0.1:56333
      SECRAGRAPH_QDRANT_URL: http://127.0.0.1:56333
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.12"
      - run: uv python install 3.11
      - run: uv sync --frozen --dev
      - name: Create isolated read-only database role
        run: |
          docker cp infra/postgres/init/002_reader_login.sh \
            "${{ job.services.postgres.id }}:/tmp/002_reader_login.sh"
          docker exec \
            -e SECRAGRAPH_READER_PASSWORD="$(openssl rand -hex 24)" \
            "${{ job.services.postgres.id }}" \
            sh /tmp/002_reader_login.sh
      - run: uv run alembic upgrade head
      - run: uv run security-review import-intelligence --cwe data/samples/cwe.csv --cve data/samples/cve.csv
      - run: uv run security-review bootstrap-qdrant
      - name: Run full suite with live API
        run: uv run python -m scripts.ci_full_tests

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.12"
      - run: uv python install 3.11
      - run: uv sync --frozen --dev
      - run: uv run python scripts/ci_dependency_audit.py

  container-build:
    needs: [quality, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IMAGE_POLICY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.12"
      - run: uv python install 3.11
      - run: uv sync --frozen --dev
      - name: Install verified Trivy 0.76.1
        run: uv run python -m infra.scanners.install_trivy build/tools/trivy
      - name: Refresh Trivy vulnerability DB
        run: |
          mkdir -p build/trivy-cache
          build/tools/trivy/trivy image --download-db-only \
            --cache-dir build/trivy-cache --disable-telemetry \
            --skip-version-check --quiet
      - name: Build one runtime image and save its immutable ID
        run: |
          docker build --provenance=false --platform linux/amd64 \
            --target runtime --tag secragraph:ci .
          image_id="$(docker image inspect --format '{{.Id}}' secragraph:ci)"
          if [[ ! "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'invalid local image ID' >&2
            exit 1
          fi
          printf 'local_image_id=%s\n' "$image_id"
          mkdir -p build/evidence
          docker image save --output build/evidence/container-image.tar "$image_id"
          printf '%s' "$image_id" > build/evidence/container-image-id.txt
      - name: Scan saved image and generate CycloneDX SBOM
        run: |
          image_id="$(cat build/evidence/container-image-id.txt)"
          uv run security-review scan-image build/evidence/container-image.tar \
            --image-id "$image_id" \
            --trivy-binary build/tools/trivy/trivy \
            --cache-dir build/trivy-cache \
            --output-dir build/evidence/container \
            --offline-evidence
      - name: Block new severe image findings and policy changes
        run: |
          uv run python -m scripts.ci_container_image \
            --manifest build/evidence/container/container.manifest.json \
            --baseline data/security/container-image-baseline.json \
            --base-sha "$IMAGE_POLICY_BASE_SHA" \
            --repo-root "$PWD"
      - name: Publish normalized image evidence and SBOM
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secragraph-container-evidence
          path: |
            build/evidence/container/container.json
            build/evidence/container/container.md
            build/evidence/container/container.sarif
            build/evidence/container/container.cdx.json
            build/evidence/container/container.manifest.json
          if-no-files-found: error
          retention-days: 14

  compose-smoke:
    needs: [quality, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.12"
      - run: uv python install 3.11
      - run: uv sync --frozen --dev
      - name: Run isolated authenticated full-stack smoke
        run: uv run python -m scripts.compose_smoke
      - name: Require authenticated pipeline API benchmark evidence
        run: |
          test -s build/evidence/pipeline-api.json
          test -s build/evidence/pipeline-api.md
          uv run python -m json.tool build/evidence/pipeline-api.json > /dev/null
      - name: Publish authenticated pipeline API evidence
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secragraph-api-evidence
          path: |
            build/evidence/pipeline-api.json
            build/evidence/pipeline-api.md
          if-no-files-found: error
          retention-days: 14

  dast-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.12"
      - run: uv python install 3.11
      - run: uv sync --frozen --dev
      - name: Run passive and active DAST against disposable local API
        run: uv run python -m scripts.run_dast_evidence
      - name: Parse normalized DAST evidence
        run: |
          test -s build/evidence/dast.json
          test -s build/evidence/dast.md
          test -s build/evidence/dast.sarif
          test -s build/evidence/dast-active.json
          test -s build/evidence/dast-active.md
          test -s build/evidence/dast-active.sarif
          test -s build/evidence/dast-benchmark.json
          test -s build/evidence/dast-benchmark.md
          uv run python -m json.tool build/evidence/dast.json > /dev/null
          uv run python -m json.tool build/evidence/dast.sarif > /dev/null
          uv run python -m json.tool build/evidence/dast-active.json > /dev/null
          uv run python -m json.tool build/evidence/dast-active.sarif > /dev/null
          uv run python -m json.tool build/evidence/dast-benchmark.json > /dev/null
      - name: Publish normalized DAST evidence
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secragraph-dast-evidence
          path: |
            build/evidence/dast.json
            build/evidence/dast.md
            build/evidence/dast.sarif
            build/evidence/dast-active.json
            build/evidence/dast-active.md
            build/evidence/dast-active.sarif
            build/evidence/dast-benchmark.json
            build/evidence/dast-benchmark.md
          if-no-files-found: error
          retention-days: 14

  git-history-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the event's exact PR head from GitHub's numeric PR ref
        id: history_pr_head
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$PR_NUMBER" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          git fetch --quiet --no-tags --no-recurse-submodules origin \
            "refs/pull/$PR_NUMBER/head:refs/remotes/origin/history-pr-head"
          fetched_head="$(git rev-parse --verify 'refs/remotes/origin/history-pr-head^{commit}')"
          test "$fetched_head" = "$PR_HEAD_SHA"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.12"
      - run: uv python install 3.11
      - run: uv sync --frozen --dev
      - name: Install SHA-verified Gitleaks only
        run: |
          case "$(uname -m)" in
            x86_64) scanner_arch=amd64 ;;
            aarch64) scanner_arch=arm64 ;;
            *) exit 1 ;;
          esac
          python infra/scanners/install_tools.py build/tools "$scanner_arch" --gitleaks-only
          test -x build/tools/gitleaks
      - name: Generate validated Git-history evidence
        id: history_generate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: uv run python -m scripts.run_history_evidence generate --binary "$PWD/build/tools/gitleaks"
      - name: Block on historical secret findings
        id: history_gate
        run: uv run python -m scripts.run_history_evidence gate
      - name: Publish clean main history evidence
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch') &&
          steps.history_generate.outcome == 'success' && steps.history_gate.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secragraph-history-evidence
          path: |
            build/evidence/history.json
            build/evidence/history.md
            build/evidence/history.sarif
          if-no-files-found: error
          retention-days: 14

  pipeline-benchmark:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch')
    needs: [quality, tests, dependency-security, container-build, compose-smoke, dast-evidence, git-history-secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPENDENCY_SECURITY_RESULT: ${{ needs.dependency-security.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.12"
      - run: uv python install 3.11
      - run: uv sync --frozen --dev
      - name: Download API evidence from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: secragraph-api-evidence
          path: build/component-evidence/api
      - name: Download scanner and RAG evidence from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: secragraph-evidence
          path: build/component-evidence/scanner
      - name: Download DAST evidence from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: secragraph-dast-evidence
          path: build/component-evidence/dast
      - name: Download image and SBOM evidence from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: secragraph-container-evidence
          path: build/component-evidence/container
      - name: Download Git-history evidence from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: secragraph-history-evidence
          path: build/component-evidence/history
      - name: Validate and aggregate whole-tool benchmark
        run: uv run python -m scripts.aggregate_pipeline_benchmark --evidence-root build/component-evidence
      - name: Parse whole-tool benchmark JSON
        run: |
          test -s build/evidence/pipeline-benchmark.json
          test -s build/evidence/pipeline-benchmark.md
          uv run python -m json.tool build/evidence/pipeline-benchmark.json > /dev/null
      - name: Publish whole-tool pipeline benchmark
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secragraph-pipeline-benchmark
          path: |
            build/evidence/pipeline-benchmark.json
            build/evidence/pipeline-benchmark.md
          if-no-files-found: error
          retention-days: 14
