name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.12"
      - run: uv python install 3.11
      - run: uv sync --frozen --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src apps scripts/local_up.py scripts/prepare_case_corpus.py
      - run: uv run bandit -q -r src apps
      - name: Run keyless RAG evidence
        run: uv run python -m scripts.run_rag_evidence
      - name: Validate RAG evidence files
        run: |
          test -s build/evidence/rag.json
          test -s build/evidence/rag.md
          uv run python -m json.tool build/evidence/rag.json > /dev/null

      - name: Build pinned scanner runtime
        run: docker build --target runtime --tag secragraph:benchmark .
      - name: Measure authored multi-engine scanner cases
        run: |
          mkdir -p build/evidence
          docker run --rm --network none --read-only \
            --security-opt no-new-privileges --cap-drop ALL \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp/secragraph:rw,exec,nosuid,nodev,size=256m,mode=1777 \
            --tmpfs /tmp/secragraph-snapshots:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --mount type=bind,src="$PWD/scripts",dst=/app/scripts,readonly \
            --mount type=bind,src="$PWD/build/evidence",dst=/app/build/evidence \
            secragraph:benchmark /app/.venv/bin/python \
            -m scripts.run_multiengine_benchmark \
            --cases data/evaluation/multiengine_cases.json \
            --staging-dir /tmp/secragraph \
            --output-dir /app/build/evidence \
            --require-complete --require-traces
      - name: Require multi-engine JSON evidence
        run: test -s build/evidence/multiengine-scanner.json
      - name: Require multi-engine Markdown evidence
        run: test -s build/evidence/multiengine-scanner.md
      - name: Parse multi-engine JSON evidence
        run: uv run python -m json.tool build/evidence/multiengine-scanner.json > /dev/null
      - name: Publish RAG and scanner evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secragraph-evidence
          path: |
            build/evidence/rag.json
            build/evidence/rag.md
            build/evidence/multiengine-scanner.json
            build/evidence/multiengine-scanner.md
          if-no-files-found: error
          retention-days: 14

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: secragraph_test
          POSTGRES_USER: secragraph
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U secragraph -d secragraph_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 56333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      SECRAGRAPH_DATABASE_URL: postgresql+psycopg://secragraph@127.0.0.1:55432/secragraph_test
      SECRAGRAPH_TEST_DATABASE_URL: postgresql+psycopg://secragraph@127.0.0.1:55432/secragraph_test
      SECRAGRAPH_TEST_QDRANT_URL: http://127.0.0.1:56333
      SECRAGRAPH_QDRANT_URL: http://127.0.0.1:56333
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.12"
      - run: uv python install 3.11
      - run: uv sync --frozen --dev
      - name: Create isolated read-only database role
        run: |
          docker cp infra/postgres/init/002_reader_login.sh \
            "${{ job.services.postgres.id }}:/tmp/002_reader_login.sh"
          docker exec \
            -e SECRAGRAPH_READER_PASSWORD="$(openssl rand -hex 24)" \
            "${{ job.services.postgres.id }}" \
            sh /tmp/002_reader_login.sh
      - run: uv run alembic upgrade head
      - run: uv run security-review import-intelligence --cwe data/samples/cwe.csv --cve data/samples/cve.csv
      - run: uv run security-review bootstrap-qdrant
      - name: Run full suite with live API
        run: uv run python -m scripts.ci_full_tests

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.12"
      - run: uv python install 3.11
      - run: uv sync --frozen --dev
      - run: uv run python scripts/ci_dependency_audit.py

  container-build:
    needs: [quality, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --target runtime --tag secragraph:ci .

  compose-smoke:
    needs: [quality, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.12"
      - run: uv python install 3.11
      - run: uv sync --frozen --dev
      - name: Run isolated authenticated full-stack smoke
        run: uv run python -m scripts.compose_smoke
